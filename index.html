<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La Baguette Française</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;

    background:
        linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.75)),
        url("https://img.magnific.com/photos-gratuite/gouttes-fumee-rouge-vif_23-2147734858.jpg?semt=ais_hybrid&w=740&q=80") center center / cover fixed no-repeat;

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px;
}

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

       body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;

    background:
        linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.75)),
        url("https://png.pngtree.com/thumb_back/fw800/background/20250903/pngtree-a-red-and-black-background-with-the-silhouette-of-an-evil-image_18753621.webp") center center / cover fixed no-repeat;

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px;
}

        /* NOM */

        h1 {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 8px;

            text-shadow:
                0 0 15px rgba(255, 0, 0, 0.5);
        }

        h1 span {
            color: #ff0000;
        }

        .description {
            color: #999999;
            margin-bottom: 30px;
            font-size: 15px;
        }

        /* BOUTONS */

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            min-height: 65px;

            padding: 15px 20px;

            color: white;
            text-decoration: none;

            background: rgba(15, 15, 15, 0.95);

            border: 1px solid #333333;
            border-left: 4px solid #ff0000;

            border-radius: 12px;

            font-size: 17px;
            font-weight: bold;

            transition: 0.25s ease;
        }

        .link:hover {
            transform: translateY(-3px);

            background: #180000;

            border-color: #ff0000;

            box-shadow:
                0 0 20px rgba(255, 0, 0, 0.4);
        }

        .icon {
            position: absolute;
            left: 20px;
            font-size: 25px;
        }

        /* FOOTER */

        footer {
            margin-top: 30px;
            color: #555555;
            font-size: 12px;
        }

        footer span {
            color: #ff0000;
        }

        /* TELEPHONE */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .profile {
                width: 140px;
                height: 140px;
            }

            h1 {
                font-size: 30px;
            }

            .link {
                min-height: 60px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- =================================
             TON IMAGE
             
             Mets ton image dans le même dossier
             que index.html.
             
             Exemple :
             image.png
        ================================== -->

        <div class="profile">
            <img src="image.png" alt="Photo de profil">
        </div>


        <!-- =================================
             NOM DU SITE
        ================================== -->

        <h1>
            La Baguette <span>Française</span>
        </h1>

        <p class="description">
            Mes réseaux
        </p>


        <!-- =================================
             BOUTONS
        ================================== -->

        <div class="links">

            <!-- ROBLOX -->

            <a
                class="link"
                href="https://www.roblox.com/users/7385981973/profile?friendshipSourceType=PlayerSearch"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">🎮</span>
                <span>Roblox</span>
            </a>


            <!-- INSTAGRAM -->

            <a
                class="link"
                href="https://www.instagram.com/vuntriasupport/?utm_source=ig_web_button_share_sheet"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">📸</span>
                <span>Instagram</span>
            </a>


            <!-- DISCORD -->

            <a
                class="link"
                href="https://discord.gg/WvfDASEykn"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">💬</span>
                <span>Discord</span>
            </a>

        </div>


        <!-- =================================
             BAS DE PAGE
        ================================== -->

        <footer>
            © 2026 <span>La Baguette Française</span>
        </footer>

    </div>

</body>
</html>
