<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La Baguette Française</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;

    background:
        linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.75)),
        url("https://i.pinimg.com/originals/d2/1d/fb/d21dfbca18717b30354f971bda6a6410.png") center center / cover fixed no-repeat;

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px;
}

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

    /* IMAGE */ 
      .profile {
    width: 170px;
    height: 170px;
    margin: 0 auto 25px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #ff0000;

    box-shadow:
        0 0 15px #ff0000,
        0 0 45px rgba(255, 0, 0, 0.5);
}

.profile img {
    width: 100%;
    height: 100%;
    object-fit: cover;

    filter:
        grayscale(100%)
        contrast(1.3)
        brightness(0.75)
        sepia(100%)
        hue-rotate(315deg)
        saturate(500%);
}
        /* NOM */

        h1 {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 8px;

            text-shadow:
                0 0 15px rgba(255, 0, 0, 0.5);
        }

        h1 span {
            color: #ff0000;
        }

        .description {
            color: #999999;
            margin-bottom: 30px;
            font-size: 15px;
        }

        /* BOUTONS */

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            min-height: 65px;

            padding: 15px 20px;

            color: white;
            text-decoration: none;

            background: rgba(15, 15, 15, 0.95);

            border: 1px solid #333333;
            border-left: 4px solid #ff0000;

            border-radius: 12px;

            font-size: 17px;
            font-weight: bold;

            transition: 0.25s ease;
        }

        .link:hover {
            transform: translateY(-3px);

            background: #180000;

            border-color: #ff0000;

            box-shadow:
                0 0 20px rgba(255, 0, 0, 0.4);
        }

        .icon {
            position: absolute;
            left: 20px;
            font-size: 25px;
        }

        /* FOOTER */

        footer {
            margin-top: 30px;
            color: #555555;
            font-size: 12px;
        }

        footer span {
            color: #ff0000;
        }

        /* TELEPHONE */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .profile {
                width: 140px;
                height: 140px;
            }

            h1 {
                font-size: 30px;
            }

            .link {
                min-height: 60px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- =================================
             TON IMAGE
             
             Mets ton image dans le même dossier
             que index.html.
             
             Exemple :
             image.png
        ================================== -->

        <div class="profile">
            <img src="https://img.wattpad.com/b5f5e1e8e01e82f677c535bab0b0b85805857714/68747470733a2f2f73332e616d617a6f6e6177732e636f6d2f776174747061642d6d656469612d736572766963652f53746f7279496d6167652f67334f7761625a70535a573450413d3d2d31342e313761306430376132643537323132643230313539323032333930302e6a7067" alt="Photo de profil">
        </div>


        <!-- =================================
             NOM DU SITE
        ================================== -->

        <h1>
            La Baguette <span>Française</span>
        </h1>

        <p class="description">
            Mes réseaux
        </p>


        <!-- =================================
             BOUTONS
        ================================== -->

        <div class="links">

            <!-- ROBLOX -->

            <a
                class="link"
                href="https://www.roblox.com/users/7385981973/profile?friendshipSourceType=PlayerSearch"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">🎮</span>
                <span>Roblox</span>
            </a>


            <!-- INSTAGRAM -->

            <a
                class="link"
                href="https://www.instagram.com/vuntriasupport/?utm_source=ig_web_button_share_sheet"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">📸</span>
                <span>Instagram</span>
            </a>


            <!-- DISCORD -->

            <a
                class="link"
                href="https://discord.gg/WvfDASEykn"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">💬</span>
                <span>Discord</span>
            </a>

        </div>


        <!-- =================================
             BAS DE PAGE
        ================================== -->

        <footer>
            © 2026 <span>La Baguette Française</span>
        </footer>

    </div>

</body>
</html>
